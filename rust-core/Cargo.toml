[package]
name = "privacy-scanner"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
license-file = "../LICENSES/Handoff-Community-1.0.txt"

[dependencies]
regex = "=1.12.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[profile.release]
strip = true
panic = "abort"
