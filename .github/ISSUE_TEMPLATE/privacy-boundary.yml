name: Privacy-first improvement / 隐私优先改进
description: Propose one bounded improvement with synthetic evidence / 提出一个有边界且可用合成资料验证的改进
body:
  - type: markdown
    attributes:
      value: |
        Do not post sensitive data or security vulnerabilities here. Follow CONTRIBUTING.md for private reporting.
        请勿在此提交敏感资料或安全漏洞。私下报告方式见 CONTRIBUTING.md。
  - type: textarea
    id: problem
    attributes:
      label: One problem / 一个问题
      description: Who needs which result? What unnecessary disclosure should be avoided? / 谁需要什么成果？应避免什么不必要的披露？
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Boundary and permissions / 边界与权限
      description: Specify local, company or cloud destinations, purpose, onward sharing and expiry. / 说明本地、企业或云端目的地、用途、后续分享与到期时间。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Synthetic pass and fail cases / 合成的通过与失败案例
      description: Describe observable behavior, not a promise of perfect detection. / 描述可观察行为，不承诺完美识别。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and tradeoffs / 范围与取舍
      description: What is excluded, and how will latency, accuracy and disclosure be measured? / 排除哪些内容？如何测量延迟、准确率与披露范围？
